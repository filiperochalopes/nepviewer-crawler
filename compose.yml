services:
  solar:
    build:
      context: .
    container_name: solar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/nepviewer.db
      INTERVAL_SECONDS: "60"
      TZ: America/Bahia
    volumes:
      - ./data:/data:rw
    networks:
      - proxy
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
